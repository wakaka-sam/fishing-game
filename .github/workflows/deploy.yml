name: Deploy to sg

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H sub2api.wakaka007.cn >> ~/.ssh/known_hosts

      - name: Rsync to server
        run: |
          rsync -avz --delete \
            --exclude='data/' \
            --exclude='node_modules/' \
            --exclude='.git/' \
            --exclude='.github/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ root@sub2api.wakaka007.cn:/opt/fishing-game/

      - name: Restart service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            root@sub2api.wakaka007.cn \
            "systemctl restart fishing-game && sleep 1 && systemctl is-active fishing-game"

      - name: Health check
        run: |
          for i in {1..5}; do
            if curl -sf https://fish.wakaka007.cn/ > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          exit 1
